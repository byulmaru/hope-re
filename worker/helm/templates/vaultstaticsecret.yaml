{{- if .Values.vault.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "hope-worker.fullname" . }}-aws-credentials
  labels:
    {{- include "hope-worker.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vault.authRef | quote }}
  mount: secret
  type: kv-v2
  path: kubernetes/hope-worker
  refreshAfter: 5m
  destination:
    name: {{ include "hope-worker.credentialsSecretName" . }}
    create: true
    overwrite: true
    type: Opaque
{{- end }}
