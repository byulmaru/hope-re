[package]
name = "hope-api"
default-run = "hope-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"
license = "MIT"
publish = false

[[bin]]
name = "hope-infer"
path = "src/bin/hope_infer.rs"

[dependencies]
http-body-util = "0.1"
log = "0.4"
ndarray = { version = "0.17", features = [ "std" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
webp = { version = "=0.3.1", default-features = false }

[dependencies.axum]
version = "0.8"
default-features = false
features = [
  "http1",
  "json",
  "query",
  "tokio"
]

[dependencies.image]
version = "0.25"
default-features = false
features = [
  "jpeg",
  "png",
  "webp"
]

[dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false
features = [
  "download-binaries",
  "ndarray",
  "std",
  "tls-rustls"
]

[dependencies.tokio]
version = "1"
features = [
  "macros",
  "rt-multi-thread",
  "net",
  "sync",
  "time"
]

[dev-dependencies]
tower = { version = "0.5", features = [ "util" ] }

[target.'cfg(target_os = "macos")'.dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false
features = [ "coreml" ]
