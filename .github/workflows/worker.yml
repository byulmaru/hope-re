name: Worker image

on:
  pull_request:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/worker.yml
      - api/Cargo.toml
      - api/Cargo.lock
      - api/download_models.py
      - api/models.json
      - "api/src/**"
      - "src-tauri/src/onnx_integration/protection/**"
      - worker/Dockerfile
      - worker/package.json
      - worker/package-lock.json
      - worker/tsconfig.json
      - "worker/src/**"
      - worker/test/image-smoke.py
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/worker.yml
      - api/Cargo.toml
      - api/Cargo.lock
      - api/download_models.py
      - api/models.json
      - "api/src/**"
      - "src-tauri/src/onnx_integration/protection/**"
      - worker/Dockerfile
      - worker/package.json
      - worker/package-lock.json
      - worker/tsconfig.json
      - "worker/src/**"
      - worker/test/image-smoke.py

permissions:
  contents: read

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Install Pillow for image smoke test
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends python3-pil
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: hope-re-worker:smoke
      - name: Smoke-test the final image
        run: python3 worker/test/image-smoke.py hope-re-worker:smoke

  publish-arch:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/byulmaru/hope-re-worker:${{ github.sha }}-${{ matrix.arch }}

  publish-manifest:
    if: github.event_name == 'push'
    needs: publish-arch
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create --tag ghcr.io/byulmaru/hope-re-worker:${{ github.sha }} ghcr.io/byulmaru/hope-re-worker:${{ github.sha }}-amd64 ghcr.io/byulmaru/hope-re-worker:${{ github.sha }}-arm64
